apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-web
  namespace: default
spec:
  replicas: 1
  selector: {matchLabels: {app: e2e-web}}
  template:
    metadata: {labels: {app: e2e-web}}
    spec:
      containers:
        - name: web
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-slow
  namespace: default
spec:
  replicas: 1
  selector: {matchLabels: {app: e2e-slow}}
  template:
    metadata: {labels: {app: e2e-slow}}
    spec:
      containers:
        - name: slow
          image: busybox:1.36
          command: ["sh", "-c", "sleep 25; touch /tmp/ready; sleep 3600"]
          readinessProbe:
            exec: {command: ["test", "-f", "/tmp/ready"]}
            periodSeconds: 2

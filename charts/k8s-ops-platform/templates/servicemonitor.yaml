{{- if and .Values.observability.enabled .Values.observability.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "k8s-ops-platform.labels" . | nindent 4 }}
    {{- with .Values.observability.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [diagnosis-agent, action-controller]
  namespaceSelector:
    matchNames: [{{ .Values.namespace }}]
  endpoints:
    - port: metrics
      interval: {{ .Values.observability.serviceMonitor.interval }}
{{- end }}

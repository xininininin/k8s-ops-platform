{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "k8s-ops-platform.agentServiceAccount" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "k8s-ops-platform.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "k8s-ops-platform.controllerServiceAccount" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "k8s-ops-platform.labels" . | nindent 4 }}
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: diagnosis-agent
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: diagnosis-agent
    {{- include "k8s-ops-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.agent.replicaCount | default .Values.replicaCount }}
  selector:
    matchLabels: {app.kubernetes.io/name: diagnosis-agent}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: diagnosis-agent
        app.kubernetes.io/part-of: k8s-ops-platform
      {{- if and .Values.observability.enabled .Values.observability.prometheusAnnotations }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.observability.metricsPort | quote }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "k8s-ops-platform.agentServiceAccount" . }}
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- toYaml .Values.agent.args | nindent 12 }}
          ports:
            - {name: metrics, containerPort: 8080}
          readinessProbe: {httpGet: {path: /healthz, port: metrics}, initialDelaySeconds: 2, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: metrics}, initialDelaySeconds: 5, periodSeconds: 10}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}, readOnlyRootFilesystem: true}
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}

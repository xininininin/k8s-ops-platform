apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: actions.ops.example.io
spec:
  group: ops.example.io
  names:
    kind: Action
    listKind: ActionList
    plural: actions
    shortNames: [opa]
    singular: action
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Type, type: string, jsonPath: .spec.actionType}
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Target, type: string, jsonPath: .spec.target.name}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              required: [actionType, target, reason, requestedBy, triggerSource]
              properties:
                actionType: {type: string, enum: [PodRestart, DeploymentRestart, NodeMaintenance]}
                target:
                  type: object
                  required: [kind, name]
                  properties:
                    kind: {type: string}
                    namespace: {type: string}
                    name: {type: string}
                reason: {type: string, minLength: 1}
                timeoutSeconds: {type: integer, format: int32, minimum: 1, default: 300}
                requestedBy: {type: string, minLength: 1}
                triggerSource: {type: string, minLength: 1}
            status:
              type: object
              properties:
                phase: {type: string, enum: [Pending, Running, Verifying, Succeeded, Failed]}
                message: {type: string}
                startedAt: {type: string, format: date-time}
                completedAt: {type: string, format: date-time}
                observedGeneration: {type: integer, format: int64}
                retryCount: {type: integer, format: int32}
                executionState: {type: string}
                targetUID: {type: string}
                workloadKind: {type: string}
                workloadName: {type: string}
                conditions:
                  type: array
                  items:
                    type: object
                    required: [lastTransitionTime, message, reason, status, type]
                    properties:
                      lastTransitionTime: {type: string, format: date-time}
                      message: {type: string}
                      observedGeneration: {type: integer, format: int64}
                      reason: {type: string}
                      status: {type: string, enum: ["True", "False", Unknown]}
                      type: {type: string}

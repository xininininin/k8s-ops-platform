apiVersion: v1
kind: ServiceAccount
metadata:
  name: diagnosis-agent
  namespace: k8s-ops-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-ops-diagnosis-agent
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["ops.example.io"]
    resources: ["actions"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-ops-diagnosis-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-ops-diagnosis-agent
subjects:
  - kind: ServiceAccount
    name: diagnosis-agent
    namespace: k8s-ops-platform

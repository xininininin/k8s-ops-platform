apiVersion: v1
kind: ServiceAccount
metadata:
  name: action-controller
  namespace: k8s-ops-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-ops-action-controller
rules:
  - apiGroups: ["ops.example.io"]
    resources: ["actions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["ops.example.io"]
    resources: ["actions/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-ops-action-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-ops-action-controller
subjects:
  - kind: ServiceAccount
    name: action-controller
    namespace: k8s-ops-platform

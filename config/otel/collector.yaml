apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  namespace: k8s-ops-platform
data:
  collector.yaml: |
    receivers:
      filelog:
        include:
          - /var/log/pods/k8s-ops-platform_diagnosis-agent-*/*/*.log
          - /var/log/pods/k8s-ops-platform_action-controller-*/*/*.log
        include_file_path: true
        operators:
          - type: container
    processors:
      memory_limiter: {check_interval: 1s, limit_mib: 128}
      batch: {}
    exporters:
      debug: {verbosity: detailed}
    service:
      pipelines:
        logs:
          receivers: [filelog]
          processors: [memory_limiter, batch]
          exporters: [debug]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-collector
  namespace: k8s-ops-platform
spec:
  selector: {matchLabels: {app: otel-collector}}
  template:
    metadata: {labels: {app: otel-collector}}
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.121.0
          args: ["--config=/etc/otel/collector.yaml"]
          volumeMounts:
            - {name: config, mountPath: /etc/otel}
            - {name: podlogs, mountPath: /var/log/pods, readOnly: true}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true}
      volumes:
        - name: config
          configMap: {name: otel-collector}
        - name: podlogs
          hostPath: {path: /var/log/pods}

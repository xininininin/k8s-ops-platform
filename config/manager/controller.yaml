apiVersion: apps/v1
kind: Deployment
metadata:
  name: action-controller
  namespace: k8s-ops-platform
  labels: {app.kubernetes.io/name: action-controller, app.kubernetes.io/part-of: k8s-ops-platform}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: action-controller}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: action-controller, app.kubernetes.io/part-of: k8s-ops-platform}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8080"}
    spec:
      serviceAccountName: action-controller
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: controller
          image: k8s-ops-platform-controller:dev
          imagePullPolicy: IfNotPresent
          args: ["--metrics-bind-address=:8080"]
          ports: [{name: metrics, containerPort: 8080}, {name: health, containerPort: 8081}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}, readOnlyRootFilesystem: true}
          resources:
            requests: {cpu: 20m, memory: 48Mi}
            limits: {cpu: 300m, memory: 192Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: action-controller
  namespace: k8s-ops-platform
  labels: {app.kubernetes.io/name: action-controller}
spec:
  selector: {app.kubernetes.io/name: action-controller}
  ports: [{name: metrics, port: 8080, targetPort: metrics}]

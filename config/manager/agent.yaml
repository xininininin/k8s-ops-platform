apiVersion: apps/v1
kind: Deployment
metadata:
  name: diagnosis-agent
  namespace: k8s-ops-platform
  labels: {app.kubernetes.io/name: diagnosis-agent, app.kubernetes.io/part-of: k8s-ops-platform}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: diagnosis-agent}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: diagnosis-agent, app.kubernetes.io/part-of: k8s-ops-platform}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8080"}
    spec:
      serviceAccountName: diagnosis-agent
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: agent
          image: k8s-ops-platform-agent:dev
          imagePullPolicy: IfNotPresent
          args: ["--metrics-bind-address=:8080", "--auto-pod-restart=false", "--auto-deployment-restart=false"]
          ports: [{name: metrics, containerPort: 8080}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}, readOnlyRootFilesystem: true}
          resources:
            requests: {cpu: 20m, memory: 48Mi}
            limits: {cpu: 300m, memory: 192Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: diagnosis-agent
  namespace: k8s-ops-platform
  labels: {app.kubernetes.io/name: diagnosis-agent}
spec:
  selector: {app.kubernetes.io/name: diagnosis-agent}
  ports: [{name: metrics, port: 8080, targetPort: metrics}]

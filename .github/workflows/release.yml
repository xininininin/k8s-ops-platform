name: Release

on:
  push:
    branches: [main, master]
    tags: ['*']

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Test and publish images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Test release source
        run: make ci
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve immutable image coordinates
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          sha_tag="sha-${GITHUB_SHA::12}"
          echo "prefix=ghcr.io/${repository}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${sha_tag}" >> "$GITHUB_OUTPUT"
      - name: Build and push immutable SHA images
        run: |
          make docker-build IMAGE_PREFIX="${{ steps.image.outputs.prefix }}" TAG="${{ steps.image.outputs.sha_tag }}" SOURCE="https://github.com/${GITHUB_REPOSITORY}"
          make docker-push IMAGE_PREFIX="${{ steps.image.outputs.prefix }}" TAG="${{ steps.image.outputs.sha_tag }}"
      - name: Publish latest alias
        if: github.ref_type == 'branch'
        run: |
          make docker-tag IMAGE_PREFIX="${{ steps.image.outputs.prefix }}" TAG="${{ steps.image.outputs.sha_tag }}" TARGET_TAG=latest
          make docker-push IMAGE_PREFIX="${{ steps.image.outputs.prefix }}" TAG=latest
      - name: Publish Git tag alias
        id: git_tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          release_tag="$(printf '%s' "$GITHUB_REF_NAME" | tr '/+' '--')"
          make docker-tag IMAGE_PREFIX="${{ steps.image.outputs.prefix }}" TAG="${{ steps.image.outputs.sha_tag }}" TARGET_TAG="$release_tag"
          make docker-push IMAGE_PREFIX="${{ steps.image.outputs.prefix }}" TAG="$release_tag"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
      - name: Report published image tags
        run: |
          echo "### Published images" >> "$GITHUB_STEP_SUMMARY"
          echo "- ${{ steps.image.outputs.prefix }}-agent:${{ steps.image.outputs.sha_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- ${{ steps.image.outputs.prefix }}-controller:${{ steps.image.outputs.sha_tag }}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${GITHUB_REF_TYPE}" == branch ]]; then echo "- alias: latest" >> "$GITHUB_STEP_SUMMARY"; fi
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then echo "- alias: ${{ steps.git_tag.outputs.release_tag }}" >> "$GITHUB_STEP_SUMMARY"; fi
